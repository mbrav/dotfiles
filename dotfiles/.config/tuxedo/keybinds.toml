# escape_stack = "esc"             # alias: escape
# quit = ["q", "Ctrl-c"]

# Motions inside the ↻ REPEAT overlay. Separate namespace: the overlay owns the
# keyboard while open, so these letters may collide with [normal] safely.
[recurrence]
